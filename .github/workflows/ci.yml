name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency: cancel superseded runs on the same ref so a PR push
# doesn't pile up old runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    strategy:
      # Next 15 requires Node ≥ 18.18. 18.x was dropped because
      # we'd rather catch 20/22-specific bugs during CI than ship
      # them to a runtime we don't use locally.
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Next 15 renamed `useFormState` → `useActionState`. If the
      # codemod missed a call site (or someone reintroduces one in
      # a future PR), this grep fails the build before the rename
      # silently bit-rots through a release.
      - name: no useFormState leftovers
        run: |
          set -e
          if grep -RIn --include='*.ts' --include='*.tsx' "useFormState" app/ lib/ components/; then
            echo "❌ Found 'useFormState' — use React 19's useActionState."
            exit 1
          fi
          echo "✅ no useFormState references"

  unit-tests:
    name: vitest
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run

  # Hard guard against re-introducing a banned provider via either
  # source code or env var. The boot-time check in lib/env.ts catches
  # env vars; the ESLint rule catches source. This grep is the third
  # belt: it scans for the literal string anywhere outside the
  # designated registry file.
  banned-providers-grep:
    name: banned providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep for deepseek
        run: |
          set -e
          ALLOWED='src/agents/_core/banned.ts|src/services/env.ts|tests/lib/llm.banned.test.ts|docs/decisions.md|.github/workflows/ci.yml|.eslintrc.cjs|README.md|tests/setup.ts|.env.local.example|scripts/dev-bootstrap.ts'
          MATCHES=$(grep -RIin --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git "deepseek" . | grep -Ev "($ALLOWED)" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Found 'deepseek' references outside the allow-list:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ no banned provider references"

  # Same idea as the banned-providers grep, but for posthog imports
  # outside the wrapped helper. The wrapped helper enforces the
  # `adie_*` event ban, which is the rule we care about.
  wrapped-posthog-grep:
    name: posthog wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep for posthog imports
        run: |
          set -e
          ALLOWED='lib/observability/posthog.ts|lib/observability/index.ts|tests/lib/posthog.banned-events.test.ts|.eslintrc.cjs|docs/decisions.md|README.md|docs/dev-runbook.md|.github/workflows/ci.yml'
          MATCHES=$(grep -RIin --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git "from ['\"]posthog" . | grep -Ev "($ALLOWED)" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Found 'posthog' imports outside the wrapper:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ all posthog imports go through @/lib/observability"

  # Schema isolation check: verify that admissions, wellbeing, and
  # commons_db schemas have no cross-contamination in DB query modules.
  # The typed query modules in src/db/ must only reference their own
  # schema's tables. This catches accidental joins across schemas that
  # would bypass RLS.
  check-isolation:
    name: schema isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep for cross-schema references
        run: |
          set -e
          FOUND=0

          # Check that admissions DB modules don't reference wellbeing tables
          if grep -RIin --include='*.ts' "wellbeing\." src/db/admissions/ 2>/dev/null; then
            echo "❌ admissions DB module references wellbeing schema"
            FOUND=1
          fi

          # Check that wellbeing DB modules don't reference admissions tables
          if grep -RIin --include='*.ts' "admissions\." src/db/wellbeing/ 2>/dev/null; then
            echo "❌ wellbeing DB module references admissions schema"
            FOUND=1
          fi

          # Check that commons_db modules don't reference admissions or wellbeing
          if grep -RIin --include='*.ts' -E "(admissions|wellbeing)\." src/db/commons/ 2>/dev/null; then
            echo "❌ commons DB module references admissions or wellbeing schema"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✅ no cross-schema references in DB modules"

  # Cross-surface imports are the single most dangerous refactor the
  # codebase can accept. Anything in `components/admissions/` or
  # `lib/admissions/` must never be imported from inside
  # `app/(wellbeing)/` or `components/adie/`. The inverse is also a
  # bug (admissions pulling in wellbeing-chrome is how PostHog ends
  # up capturing an `adie_*` event), and this grep catches both
  # sides.
  #
  # The intent: if a wellbeing file ever imports from an admissions
  # path, fail CI. The grep looks for `@/components/admissions` or
  # `@/lib/admissions` literals inside any .ts/.tsx file whose path
  # lives under `app/(wellbeing)/` or `components/adie/`, and
  # vice-versa for the wellbeing paths inside admissions surfaces.
  cross-surface-imports:
    name: cross-surface imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep wellbeing → admissions leakage
        run: |
          set -e
          # NOTE: Bash parenthesis in path is literal — we match the
          # Next.js route group folders exactly.
          PATHS='app/(wellbeing) components/adie lib/wellbeing src/workers/handlers/adie-message.ts'
          # Match only ES import statements (`from "@/..."` or
          # `import "@/..."`) so the grep doesn't trip on files
          # that merely name the forbidden path in a comment. We
          # saw that false positive locally with the same pattern.
          BAD_PATTERN='(from|import)[[:space:]]+["'"'"']@/(components/admissions|lib/admissions)'
          FOUND=0
          for p in $PATHS; do
            [ -e "$p" ] || continue
            M=$(grep -RIin --include='*.ts' --include='*.tsx' -E "$BAD_PATTERN" "$p" || true)
            if [ -n "$M" ]; then
              echo "❌ Wellbeing surface is importing admissions chrome — this leaks PostHog, admissions copy, and the main nav into a mental-health surface:"
              echo "$M"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✅ no admissions→wellbeing leakage"
      - name: grep admissions → wellbeing chrome leakage
        run: |
          set -e
          PATHS='app/(admissions) components/admissions lib/admissions components/cef'
          # components/ui is deliberately shared (pure presentational
          # primitives), so we only flag `components/adie` and
          # `lib/wellbeing` leaking into the admissions surface.
          # Import-statement-only match — see the rationale above.
          BAD_PATTERN='(from|import)[[:space:]]+["'"'"']@/(components/adie|lib/wellbeing)'
          FOUND=0
          for p in $PATHS; do
            [ -e "$p" ] || continue
            M=$(grep -RIin --include='*.ts' --include='*.tsx' -E "$BAD_PATTERN" "$p" || true)
            if [ -n "$M" ]; then
              echo "❌ Admissions surface is importing wellbeing chrome — this puts Adie copy on an admissions page, which is a brand + safety regression:"
              echo "$M"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✅ no wellbeing→admissions leakage"

  # Hexagonal src/ layer boundaries. Six rules from
  # docs/scaffold-deltas/02-src-restructure.md §CI enforcement:
  #
  #   1. /src/api cannot import from workers or agents
  #   2. /src/services cannot import from api, next, or express
  #   3. /src/agents cannot import from api or services (env allowed)
  #   4. /src/workers cannot import from api
  #   5. /src/db is leaf — no services/agents/api/workers (env allowed)
  #   6. app/** + components/** cannot import from api/workers/agents
  #      (app/api/** is the one exception — those are the App Router
  #       shim files introduced in Delta 2 PR 9)
  #
  # Local mirror: scripts/check-src-boundaries.sh (`pnpm check:src-boundaries`).
  # The same script is invoked here so the two stay in lockstep — if
  # the rules change, there's exactly one place to edit.
  src-layer-boundaries:
    name: src layer boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep src/ layer violations
        run: bash scripts/check-src-boundaries.sh
